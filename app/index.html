<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #faf7f2; --card: #ffffff; --ink: #1f2522; --muted: #6b726e; --line: #e7e2d9;
  --accent: #2f6f5e; --accent-soft: #dcebe5; --tiny: #c98a2b; --tiny-soft: #f6e8d2; --danger: #b4483c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151a18; --card: #1e2421; --ink: #ecefed; --muted: #9aa39e; --line: #2d3531;
    --accent: #6cc3a8; --accent-soft: #23392f; --tiny: #e2ad5c; --tiny-soft: #3a2f1e; --danger: #e07a6d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151a18; --card: #1e2421; --ink: #ecefed; --muted: #9aa39e; --line: #2d3531;
  --accent: #6cc3a8; --accent-soft: #23392f; --tiny: #e2ad5c; --tiny-soft: #3a2f1e; --danger: #e07a6d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 20px 0 2px; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); margin: 0 0 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }

/* Progress header */
.progress { display: flex; align-items: center; gap: 16px; padding: 16px; margin-top: 14px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.progress p { margin: 0; }
.progress .msg { font-weight: 600; }

/* Checklist */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.check { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; transition: transform .12s, background .2s, border-color .2s; }
.check:active { transform: scale(.9); }
.check svg { width: 18px; height: 18px; opacity: 0; transition: opacity .2s; }
.item.done .check { background: var(--accent); border-color: var(--accent); }
.item.tinydone .check { background: var(--tiny); border-color: var(--tiny); }
.item.done .check svg, .item.tinydone .check svg { opacity: 1; }
.item .body { flex: 1; min-width: 0; }
.item .name { font-weight: 600; }
.item.done .name { color: var(--muted); text-decoration: line-through; }
.item .meta { font-size: .82rem; color: var(--muted); }
.streak { font-size: .82rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
.tinybtn { font-size: .75rem; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 9px; color: var(--muted); }
.item.tinydone .tinybtn { background: var(--tiny-soft); color: var(--tiny); border-color: var(--tiny); }
.empty { padding: 22px; text-align: center; color: var(--muted); }

/* Nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
nav button { flex: 1; max-width: 160px; border: 0; background: transparent; padding: 8px; border-radius: 12px; color: var(--muted); font-weight: 600; }
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

/* Forms */
.form { padding: 16px; display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: .8rem; }
.days button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.danger { color: var(--danger); }
.templates { display: flex; gap: 8px; flex-wrap: wrap; }
.templates button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }

/* Stats */
.stat { padding: 14px; margin-bottom: 10px; }
.stat header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 26px)); gap: 4px; }
.heat span { aspect-ratio: 1; border-radius: 3px; background: var(--line); }
.heat .off { background: transparent; border: 1px dashed var(--line); }
.heat .full { background: var(--accent); }
.heat .tiny { background: var(--tiny); }
.heat .today { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { font-size: .78rem; color: var(--muted); margin-top: 6px; }

/* Widget view */
body.widget { padding: 12px; max-width: 420px; }
body.widget nav, body.widget .hide-in-widget { display: none !important; }
body.widget .item { padding: 10px 12px; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; transition: all .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-view="today">Today</button>
  <button data-view="habits">Habits</button>
  <button data-view="stats">Progress</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Storage ---------- */
const KEY = 'stick:v1';
const SLOTS = { morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening', anytime: 'Anytime' };
const DAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const TEMPLATES = [
  { name: 'Morning skincare', emoji: '🧴', slot: 'morning', cue: 'brushing my teeth', tiny: 'Just sunscreen' },
  { name: 'Take my pills', emoji: '💊', slot: 'morning', cue: 'pouring my coffee', tiny: '' },
  { name: 'Evening skincare', emoji: '🌙', slot: 'evening', cue: 'taking off makeup', tiny: 'Cleanse only' },
  { name: 'Drink water', emoji: '💧', slot: 'anytime', cue: 'sitting at my desk', tiny: 'One glass' },
  { name: 'Move my body', emoji: '🚶', slot: 'afternoon', cue: 'lunch', tiny: '5-minute walk' },
  { name: 'Read', emoji: '📖', slot: 'evening', cue: 'getting into bed', tiny: 'One page' },
];

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.habits)) return s;
  } catch (e) {}
  return { habits: [], log: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isScheduled = (h, d) => h.days.includes(d.getDay()) && keyOf(d) >= h.created;
const statusOf = (h, d) => (state.log[keyOf(d)] || {})[h.id]; // 'full' | 'tiny' | undefined

/* ---------- Streaks: "never miss twice" ----------
   Counts scheduled days completed (full or tiny). A single missed day is forgiven
   as long as the day before it was done; two misses in a row end the streak.
   Today only counts once it's done, so an unchecked today never breaks anything. */
function streak(h) {
  let d = today(), count = 0, misses = 0;
  if (isScheduled(h, d) && !statusOf(h, d)) d = addDays(d, -1);
  for (let i = 0; i < 730; i++, d = addDays(d, -1)) {
    if (keyOf(d) < h.created) break;
    if (!isScheduled(h, d)) continue;
    if (statusOf(h, d)) { count++; misses = 0; }
    else if (++misses >= 2) break;
  }
  return count;
}
function rate(h, days = 28) {
  let done = 0, sched = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(today(), -i);
    if (!isScheduled(h, d)) continue;
    if (i === 0 && !statusOf(h, d)) continue; // don't penalise the day in progress
    sched++; if (statusOf(h, d)) done++;
  }
  return sched ? Math.round((done / sched) * 100) : null;
}

/* ---------- Actions ---------- */
function setStatus(id, value) {
  const k = keyOf(today());
  const day = state.log[k] || (state.log[k] = {});
  if (day[id] === value) delete day[id]; else day[id] = value;
  save();
  const due = dueToday();
  if (value && day[id] && due.length && due.every(h => statusOf(h, today()))) {
    toast(pick(['All done for today 🎉', 'Clean sweep. Nice.', 'Every box ticked ✨']));
  } else if (day[id] === 'tiny') {
    toast('Tiny counts. Streak protected 🧡');
  }
  render();
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = () => Math.random().toString(36).slice(2, 10);
const dueToday = () => state.habits.filter(h => !h.archived && isScheduled(h, today()));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Views ---------- */
const params = new URLSearchParams(location.search);
const isWidget = params.get('view') === 'widget' || location.hash === '#widget';
let view = isWidget ? 'today' : (params.get('tab') || 'today');
let editing = null;
if (isWidget) document.body.classList.add('widget');

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function renderToday() {
  const due = dueToday();
  const done = due.filter(h => statusOf(h, today())).length;
  const pct = due.length ? done / due.length : 0;
  const C = 2 * Math.PI * 28;
  const msg = !due.length ? 'Nothing scheduled today' : done === due.length ? 'All done — enjoy your day' :
    done === 0 ? 'One tap to get started' : `${due.length - done} to go`;

  let html = `
    <h1 class="hide-in-widget">${greeting()}</h1>
    <p class="sub hide-in-widget">${today().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}</p>
    <section class="card progress">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="bg" cx="32" cy="32" r="28"/>
        <circle class="fg" cx="32" cy="32" r="28" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        <text x="32" y="32">${done}/${due.length}</text>
      </svg>
      <div><p class="msg">${msg}</p><p class="sub">Hard day? Tap “tiny” to do the 2-minute version.</p></div>
    </section>`;

  if (!state.habits.length) {
    html += `<div class="card empty" style="margin-top:14px">No habits yet.<br><br>
      <button class="primary" data-go="habits">Add your first habit</button></div>`;
    return html;
  }

  const order = Object.keys(SLOTS);
  // Put the current part of the day first so the widget shows what matters now.
  const hr = new Date().getHours();
  const now = hr < 12 ? 'morning' : hr < 18 ? 'afternoon' : 'evening';
  order.sort((a, b) => (b === now) - (a === now));

  for (const slot of order) {
    const items = due.filter(h => h.slot === slot);
    if (!items.length) continue;
    html += `<h2>${SLOTS[slot]}</h2><ul class="list card">`;
    for (const h of items) {
      const s = statusOf(h, today());
      const st = streak(h);
      html += `<li class="item ${s === 'full' ? 'done' : s === 'tiny' ? 'tinydone' : ''}">
        <button class="check" data-full="${h.id}" aria-label="Mark ${esc(h.name)} done" aria-pressed="${s === 'full'}">${CHECK}</button>
        <div class="body">
          <div class="name">${esc(h.emoji || '')} ${esc(h.name)}</div>
          ${h.cue ? `<div class="meta">After ${esc(h.cue)}</div>` : ''}
        </div>
        ${h.tiny ? `<button class="tinybtn" data-tiny="${h.id}" title="${esc(h.tiny)}" aria-pressed="${s === 'tiny'}">tiny</button>` : ''}
        ${st ? `<span class="streak" title="Current streak">🔥 ${st}</span>` : ''}
      </li>`;
    }
    html += `</ul>`;
  }
  return html;
}

function renderHabits() {
  const h = editing || { name: '', emoji: '', slot: 'morning', days: [0, 1, 2, 3, 4, 5, 6], cue: '', tiny: '' };
  let html = `<h1>Habits</h1><p class="sub">Keep the list short. Three habits you do beat ten you don’t.</p>`;

  if (!editing) {
    html += `<h2>Quick add</h2><div class="templates">${TEMPLATES.map((t, i) =>
      `<button data-template="${i}">${t.emoji} ${esc(t.name)}</button>`).join('')}</div>`;
  }

  html += `<h2>${editing && editing.id ? 'Edit habit' : 'New habit'}</h2>
  <form class="card form" id="habitForm">
    <div class="row">
      <label style="flex:0 0 72px">Icon<input name="emoji" maxlength="4" value="${esc(h.emoji)}" placeholder="✨"></label>
      <label>Habit<input name="name" required maxlength="40" value="${esc(h.name)}" placeholder="Take my pills"></label>
    </div>
    <label>When in the day
      <select name="slot">${Object.entries(SLOTS).map(([k, v]) => `<option value="${k}" ${h.slot === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    </label>
    <label>Which days<div class="days" id="days">${DAY_LABELS.map((l, i) =>
      `<button type="button" data-day="${i}" aria-pressed="${h.days.includes(i)}" aria-label="${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}">${l}</button>`).join('')}</div></label>
    <label>Anchor it — “After I…” <input name="cue" maxlength="60" value="${esc(h.cue)}" placeholder="brush my teeth"></label>
    <label>Tiny version for hard days (optional)<input name="tiny" maxlength="60" value="${esc(h.tiny)}" placeholder="Just sunscreen"></label>
    <button class="primary" type="submit">${editing && editing.id ? 'Save changes' : 'Add habit'}</button>
    ${editing ? `<button class="ghost" type="button" data-cancel>Cancel</button>` : ''}
    ${editing && editing.id ? `<button class="ghost danger" type="button" data-delete="${editing.id}">Delete habit</button>` : ''}
  </form>`;

  const active = state.habits.filter(x => !x.archived);
  if (active.length) {
    html += `<h2>Your habits</h2><ul class="list card">${active.map(x => `
      <li class="item"><div class="body"><div class="name">${esc(x.emoji || '')} ${esc(x.name)}</div>
      <div class="meta">${SLOTS[x.slot]} · ${x.days.length === 7 ? 'Every day' : x.days.map(d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')}</div></div>
      <button class="ghost" data-edit="${x.id}">Edit</button></li>`).join('')}</ul>`;
  }

  html += `<h2>Your data</h2><div class="row">
    <button class="ghost" data-export>Export backup</button>
    <label class="ghost" style="display:block;text-align:center;color:var(--ink);font-size:1rem;cursor:pointer">Import backup<input type="file" accept="application/json" data-import hidden></label>
  </div>
  <p class="sub" style="margin-top:12px">Tip: open <a href="#widget" onclick="setTimeout(()=>location.reload())" style="color:var(--accent)">the compact checklist</a> and “Add to Home Screen” for a one-tap checklist.</p>`;
  return html;
}

function renderStats() {
  const active = state.habits.filter(h => !h.archived);
  let html = `<h1>Progress</h1><p class="sub">Last 4 weeks. Gold squares are “tiny” days — they still count.</p>`;
  if (!active.length) return html + `<div class="card empty">Add a habit to see progress here.</div>`;

  // Align the grid so columns are weekdays starting Sunday, 4 weeks back.
  const start = addDays(today(), -(today().getDay() + 21));
  for (const h of active) {
    const r = rate(h);
    let cells = '';
    for (let i = 0; i < 28; i++) {
      const d = addDays(start, i);
      const future = d > today();
      const cls = future ? 'off' : !isScheduled(h, d) ? 'off' : statusOf(h, d) === 'full' ? 'full' : statusOf(h, d) === 'tiny' ? 'tiny' : '';
      cells += `<span class="${cls} ${keyOf(d) === keyOf(today()) ? 'today' : ''}" title="${d.toDateString()}"></span>`;
    }
    html += `<section class="card stat"><header><strong>${esc(h.emoji || '')} ${esc(h.name)}</strong>
      <span class="sub" style="margin:0">🔥 ${streak(h)} · ${r === null ? '—' : r + '%'}</span></header>
      <div class="heat">${cells}</div></section>`;
  }
  html += `<p class="legend">Streaks use the “never miss twice” rule: one missed day is forgiven, two in a row resets.</p>`;
  return html;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = view === 'habits' ? renderHabits() : view === 'stats' ? renderStats() : renderToday();
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { view = d.view; editing = null; render(); scrollTo(0, 0); }
  else if (d.go) { view = d.go; render(); }
  else if (d.full) setStatus(d.full, 'full');
  else if (d.tiny) setStatus(d.tiny, 'tiny');
  else if (d.template) { editing = { ...TEMPLATES[d.template], days: [0, 1, 2, 3, 4, 5, 6] }; render(); }
  else if (d.edit) { editing = { ...state.habits.find(h => h.id === d.edit) }; render(); scrollTo(0, 0); }
  else if ('cancel' in d) { editing = null; render(); }
  else if (d.delete) {
    // Two-tap confirm (in-page, since some hosts block confirm() dialogs).
    if (d.armed) {
      state.habits.find(h => h.id === d.delete).archived = true; save(); editing = null; render();
    } else {
      d.armed = '1'; t.textContent = 'Tap again to delete';
    }
  }
  else if (d.day !== undefined) t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true');
  else if ('export' in d) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `stick-backup-${keyOf(today())}.json` });
    a.click(); URL.revokeObjectURL(a.href);
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'habitForm') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const days = [...document.querySelectorAll('#days button')].filter(b => b.getAttribute('aria-pressed') === 'true').map(b => +b.dataset.day);
  if (!days.length) return toast('Pick at least one day');
  const data = { name: f.get('name').trim(), emoji: f.get('emoji').trim(), slot: f.get('slot'), days, cue: f.get('cue').trim(), tiny: f.get('tiny').trim() };
  if (editing && editing.id) Object.assign(state.habits.find(h => h.id === editing.id), data);
  else state.habits.push({ id: uid(), created: keyOf(today()), ...data });
  save(); editing = null; toast('Saved'); view = 'today'; render();
});

document.addEventListener('change', e => {
  if (!e.target.matches('[data-import]')) return;
  const file = e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const s = JSON.parse(txt);
    if (!Array.isArray(s.habits) || typeof s.log !== 'object') throw new Error();
    state = s; save(); toast('Backup restored'); render();
  }).catch(() => toast('That file isn’t a Stick backup'));
});

// Re-render when the app comes back to the foreground (e.g. after midnight).
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
window.addEventListener('storage', () => { state = load(); render(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
